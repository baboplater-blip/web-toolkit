name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Registry audit
        # registry ↔ 페이지 정합성(고아 항목·고아 페이지·중복 id·아이콘 import) 검사.
        run: npm run audit
      - name: Production build
        env:
          # admin.spec.ts 가 정적 산출물에서 /admin?key=test-key 를 검증하므로
          # NEXT_PUBLIC_ADMIN_KEY 를 빌드 타임에 baking 한다 (CI 전용 키).
          NEXT_PUBLIC_ADMIN_KEY: test-key
        run: npm run build
      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: web/out
          retention-days: 7

  budget:
    name: Bundle budget gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: out
          path: web/out
      - name: Check First-Load JS budget
        # 라이트하우스 나이틀리는 배포 후(라이브) 회귀를 잡지만, 이 게이트는
        # 머지 전에 정적 산출물(out)의 gzip First-Load JS 를 예산과 대조해
        # 무거운 의존성이 공유 청크에 들어오는 회귀를 사전 차단한다 (서버 불필요).
        run: node scripts/check-bundle-budget.mjs

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: out
          path: web/out
      - name: Run E2E (against static build)
        # dev 서버(npm run dev)는 640 라우트를 on-demand 컴파일해 타임아웃 플레이키가
        # 심하다. 빌드 잡의 정적 산출물(out)을 serve 로 띄워 안정적으로 검증한다.
        # PLAYWRIGHT_BASE_URL 이 설정되면 playwright.config 가 webServer 를 안 띄운다.
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          npx serve out -l 3000 &
          npx wait-on -t 60000 http://localhost:3000/tools
          npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
